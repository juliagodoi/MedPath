<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedPath — importar catálogo</title><style>body{font:16px system-ui;max-width:620px;margin:40px auto;padding:20px}input,button{display:block;margin:12px 0;padding:10px;max-width:100%}#status{white-space:pre-wrap}</style></head><body><h1>Importar catálogo privado</h1><p>Esta página não contém o catálogo. Faça login com a conta administradora e selecione o JSON privado do seu computador. Não publique esse JSON no GitHub.</p><form id="login"><input type="email" id="email" placeholder="E-mail administrador" required><input type="password" id="password" placeholder="Senha" required><button>Entrar</button></form><section id="upload" hidden><input id="file" type="file" accept=".json,application/json"><button id="send">Enviar ao Firestore</button></section><p id="status" role="status"></p><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();const status=document.querySelector('#status');
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value,document.querySelector('#password').value)}catch(x){status.textContent='Falha no login: '+x.code}};
onAuthStateChanged(auth,u=>{document.querySelector('#upload').hidden=!u;if(u)status.textContent='UID administrador: '+u.uid+' — confira se está nas regras.'});
document.querySelector('#send').onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.LIST||!data.DRIVE_AULAS_INDEX)throw Error('JSON incompleto');await setDoc(doc(db,'catalog','main'),{data,version:1});status.textContent='Catálogo importado com sucesso.'}catch(e){status.textContent='Erro: '+e.message}};
</script></body></html>
